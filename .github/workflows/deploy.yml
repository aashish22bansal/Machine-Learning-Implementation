name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Jupyter Book 2 is a MyST distribution and runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jupyter Book
        run: pip install -r requirements-docs.txt

      - name: Build HTML
        # BASE_URL must match the repository name for a GitHub Pages *project*
        # site (served from /<repo>/). Remove it if you move to a custom domain
        # or a <user>.github.io repo, otherwise every asset URL gets the prefix.
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter-book build --html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
